    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0a2540" flood-opacity=".13"/>
    </filter>
  </defs>
  <rect width="760" height="420" rx="28" fill="#e0f4f8"/>
  <path d="M0 78C117 16 181 29 281 85s207 59 317-12c54-35 103-37 162-13v-60H0z" fill="#007fa3" opacity=".1"/>
  <circle cx="694" cy="71" r="42" fill="#10b981" opacity=".16"/>
  <circle cx="64" cy="359" r="55" fill="#007fa3" opacity=".09"/>

  <text x="42" y="55" fill="#0a2540" font-family="Georgia, serif" font-size="24" font-weight="700">Atendimento que entende cada pessoa</text>
  <text x="42" y="80" fill="#0a2540" font-family="Arial, sans-serif" font-size="13">No WhatsApp, cada perfil encontra o proximo passo.</text>

