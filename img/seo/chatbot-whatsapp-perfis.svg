  <text x="282" y="154" fill="#e0f4f8" font-family="Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="1">CHATBOT UTECNOLOGIA</text>
  <text x="282" y="176" fill="#fff" font-family="Georgia, serif" font-size="18" font-weight="700"><tspan x="282" dy="0">Como deseja</tspan><tspan x="282" dy="20">acessar?</tspan></text>
  <rect x="282" y="211" width="160" height="36" rx="10" fill="#007fa3"/>
