  <path d="M64 163l4 4 8-9" fill="none" stroke="#0a2540" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="92" y="168" fill="#0a2540" font-family="Arial, sans-serif" font-size="18" font-weight="700">Paciente</text>
  <rect x="61" y="187" width="126" height="37" rx="9" fill="#e0f4f8"/>
  <text x="75" y="210" fill="#0a2540" font-family="Arial, sans-serif" font-size="13">Confirmar consulta</text>
