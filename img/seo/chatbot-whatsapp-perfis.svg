<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" role="img" aria-labelledby="title desc">
  <title id="title">Chatbot do WhatsApp com perfis de paciente e profissional</title>
  <desc id="desc">Uma mensagem inicia a escolha de perfil. O paciente confirma uma consulta e o profissional recebe a agenda atualizada.</desc>
