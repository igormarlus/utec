<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 230" role="img" aria-labelledby="title desc">
  <title id="title">Resumo do fluxo do chatbot pelo WhatsApp</title>
  <desc id="desc">Uma mensagem recebida direciona a pessoa para o perfil correto e conclui uma acao no sistema.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#0a2540" flood-opacity=".16"/>
    </filter>
  </defs>
  <rect width="440" height="230" rx="24" fill="#e0f4f8"/>
  <path d="M0 0h440v38c-71 31-142 29-220 7S72 20 0 51z" fill="#007fa3" opacity=".1"/>
  <text x="28" y="42" fill="#0a2540" font-family="Georgia, serif" font-size="18" font-weight="700">WhatsApp que vira acao</text>

  <path d="M132 133h35M273 133h35" fill="none" stroke="#007fa3" stroke-width="3" stroke-linecap="round"/>
  <path d="M160 126l8 7-8 7M301 126l8 7-8 7" fill="none" stroke="#007fa3" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <g filter="url(#shadow)"><rect x="25" y="84" width="107" height="98" rx="17" fill="#fff"/></g>
  <rect x="45" y="103" width="45" height="29" rx="9" fill="#007fa3"/>
  <path d="M53 132l6-6h23" fill="#007fa3"/>
  <text x="45" y="157" fill="#0a2540" font-family="Arial, sans-serif" font-size="14" font-weight="700">Mensagem</text>
  <text x="45" y="174" fill="#0a2540" font-family="Arial, sans-serif" font-size="11">Oi, preciso de ajuda</text>

  <g filter="url(#shadow)"><rect x="168" y="84" width="105" height="98" rx="17" fill="#0a2540"/></g>
  <circle cx="198" cy="115" r="13" fill="#10b981"/>
  <path d="M193 118c4-8 8-8 12 0M195 111a3 3 0 1 0 6 0 3 3 0 1 0-6 0" fill="none" stroke="#0a2540" stroke-width="2" stroke-linecap="round"/>
  <text x="188" y="151" fill="#fff" font-family="Arial, sans-serif" font-size="14" font-weight="700">Perfil</text>
  <text x="188" y="166" fill="#e0f4f8" font-family="Arial, sans-serif" font-size="10"><tspan x="188" dy="0">Paciente ou</tspan><tspan x="188" dy="11">profissional</tspan></text>

  <g filter="url(#shadow)"><rect x="309" y="84" width="106" height="98" rx="17" fill="#fff"/></g>
  <circle cx="339" cy="115" r="13" fill="#10b981"/>
  <path d="M333 115l4 4 8-9" fill="none" stroke="#0a2540" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="329" y="151" fill="#0a2540" font-family="Arial, sans-serif" font-size="13" font-weight="700"><tspan x="329" dy="0">Acao</tspan><tspan x="329" dy="14">concluida</tspan></text>
  <text x="329" y="178" fill="#0a2540" font-family="Arial, sans-serif" font-size="8">Consulta confirmada</text>
</svg>
